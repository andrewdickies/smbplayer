name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' > /dev/null
      - name: Host checks
        run: python3 scripts/check.py
      - name: Build and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify APK ABI and test isolation
        run: python3 scripts/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smbplayer-armeabi-v7a-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release v0.28]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smbplayer-armeabi-v7a-debug
      - name: Publish v0.28
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-debug.apk smbplayer-v0.28-armeabi-v7a.apk
          sha256sum smbplayer-v0.28-armeabi-v7a.apk > SHA256SUMS
          cat > notes.md <<'EOF'
          ## smbplayer 0.28
          - SMB 主动前向磁盘缓存最高 1 GiB，8 工作者；支持索引时目标约 60 秒，低于 30 秒补充。
          - 加强跳转、暂停继续及画面停滞恢复，缓冲时显示实时网速。
          - Android 6.0+，仅 armeabi-v7a（32 位 ARM）。
          - 包含项目和第三方许可证声明。
          
          本附件为 GitHub Actions 构建的测试签名 APK。签名可能不同于此前本机构建，不能保证覆盖安装；卸载会删除本地设置，请先保留自己的来源信息。电视硬解、HDR、CEC 和透传表现仍取决于设备。
          EOF
          if ! gh release view v0.28 >/dev/null 2>&1; then
            gh release create v0.28 --target "$GITHUB_SHA" --title "smbplayer v0.28" --notes-file notes.md --latest
          fi
          gh release upload v0.28 smbplayer-v0.28-armeabi-v7a.apk SHA256SUMS --clobber
