name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' > /dev/null
      - name: Host checks
        run: python3 scripts/check.py
      - name: Build and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:assembleRelease :app:lintRelease
      - name: Verify APK ABI and test isolation
        run: python3 scripts/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smbplayer-armeabi-v7a-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smbplayer-armeabi-v7a-optimized
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
      - name: Verify optimized APK
        run: python3 scripts/verify_apk.py app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release v0.30]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smbplayer-armeabi-v7a-optimized
      - name: Publish v0.30
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/release/app-release.apk smbplayer-v0.30-armeabi-v7a.apk
          cp mapping/release/mapping.txt mapping.txt
          sha256sum smbplayer-v0.30-armeabi-v7a.apk > SHA256SUMS
          cat > notes.md <<'EOF'
          ## smbplayer 0.30
          - Hidden-control seeking reuses the existing timeline: target position, total duration and cumulative seek offset; no header or action buttons.
          - Preview hides after about two seconds of inactivity, and stays visible while buffering/recovering.
          - Forward cache target increased to five minutes, refilling below four minutes; total disk budget up to 5 GiB, reduced to preserve at least 1 GiB or 15% of initially available space.
          - Cache grows on writes. Retains watched data within budget and prioritizes eviction of older, distant blocks outside the protected playback window.
          - Android 6.0+, armeabi-v7a only. Optimized build; LibVLC native engine unchanged.

          Redmi K30 checks use a locally signed optimized build of this source. This attachment is rebuilt in GitHub Actions with a development key; its signature may differ from existing installations. Includes SHA256SUMS and the R8 mapping file. Actual TV decoder/HDR/CEC/passthrough behavior remains device-dependent.
          EOF
          if ! gh release view v0.30 >/dev/null 2>&1; then
            gh release create v0.30 --target "$GITHUB_SHA" --title "smbplayer v0.30" --notes-file notes.md --draft
          fi
          gh release upload v0.30 smbplayer-v0.30-armeabi-v7a.apk SHA256SUMS mapping.txt
          gh release edit v0.30 --draft=false --latest
