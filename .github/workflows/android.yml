name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' > /dev/null
      - name: Host checks
        run: python3 scripts/check.py
      - name: Build and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:assembleRelease :app:lintRelease
      - name: Verify APK ABI and test isolation
        run: python3 scripts/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smbplayer-armeabi-v7a-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smbplayer-armeabi-v7a-optimized
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
      - name: Verify optimized APK
        run: python3 scripts/verify_apk.py app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release v0.29]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smbplayer-armeabi-v7a-optimized
      - name: Publish v0.29
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/release/app-release.apk smbplayer-v0.29-armeabi-v7a.apk
          cp mapping/release/mapping.txt mapping.txt
          sha256sum smbplayer-v0.29-armeabi-v7a.apk > SHA256SUMS
          cat > notes.md <<'EOF'
          ## smbplayer 0.29
          - Local storage and SMB only; removed M3U and network-stream modules.
          - Two home cards, settings in the top-right corner, updated remote focus navigation.
          - Conservative R8/resource shrinking reduced the local APK from 46.4 MB to 43.4 MB (6.54%); LibVLC native libraries unchanged.
          - Redmi K30 checks cover real SMB playback, advancing displayed frames, pause/resume, forward/back seek, paused seek, track selection and controls.
          - Android 6.0+, armeabi-v7a (32-bit ARM) only. Includes license notices, SHA256SUMS and R8 mapping.

          Device checks used a locally signed optimized build of this source. This attachment is rebuilt by GitHub Actions with a development key; its signature may differ from earlier installations. Preserve your source settings before uninstalling. TV HDR, CEC, passthrough and vendor decoder behavior remain hardware-dependent.
          EOF
          if ! gh release view v0.29 >/dev/null 2>&1; then
            gh release create v0.29 --target "$GITHUB_SHA" --title "smbplayer v0.29" --notes-file notes.md --draft
          fi
          gh release upload v0.29 smbplayer-v0.29-armeabi-v7a.apk SHA256SUMS mapping.txt
          gh release edit v0.29 --draft=false --latest
