plugins { id 'com.android.application' version '8.7.3' }
android {
    namespace 'com.smbplayer.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.smbplayer.tv'
        minSdk 23
        targetSdk 34
        versionCode 28
        versionName '0.28'
        ndk { abiFilters 'armeabi-v7a' }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packaging { resources { excludes += ['META-INF/versions/**', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] } }
    // Keep dependency and project license notices available in distributed APKs.
    sourceSets { main.assets.srcDir(rootProject.file('licenses')) }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'
    implementation 'org.videolan.android:libvlc-all:3.6.5'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
